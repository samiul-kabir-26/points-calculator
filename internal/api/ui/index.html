<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Points Engine Admin</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --border: #dde1e6;
    --accent: #2f6fde; --accent-text: #ffffff; --danger: #c93636; --ok: #1f8a4c; --warn: #b26b00;
    --row-hover: #f0f3f7; --code-bg: #f2f4f7; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --panel: #1a1e24; --text: #e6e9ee; --muted: #9aa3ae; --border: #2c323a;
      --accent: #5b8ff0; --accent-text: #0b0e12; --danger: #ef6b6b; --ok: #4cc283; --warn: #e3a54a;
      --row-hover: #222831; --code-bg: #14181d; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1, h2, h3 { margin: 0; font-weight: 600; }
  h1 { font-size: 16px; } h2 { font-size: 18px; } h3 { font-size: 15px; }
  a { color: var(--accent); }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }

  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  header .spacer { flex: 1; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .badge.on { color: var(--ok); border-color: currentColor; }
  .badge.off { color: var(--muted); }
  .badge.warn { color: var(--warn); border-color: currentColor; }

  .layout { display: grid; grid-template-columns: 200px 1fr; min-height: calc(100vh - 53px); }
  nav { border-right: 1px solid var(--border); padding: 12px 8px; background: var(--panel); }
  nav button { display: block; width: 100%; text-align: left; padding: 8px 12px; margin-bottom: 2px; border: 0; border-radius: 6px; background: none; color: var(--text); font: inherit; cursor: pointer; }
  nav button:hover { background: var(--row-hover); }
  nav button.active { background: var(--accent); color: var(--accent-text); }
  main { padding: 20px; min-width: 0; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 8px; }
    nav button { width: auto; white-space: nowrap; }
    main { padding: 16px; }
  }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
  .panel-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .panel-head .spacer { flex: 1; }
  .panel-body { padding: 16px; }
  .stack > * + * { margin-top: 16px; }
  .split { display: grid; grid-template-columns: minmax(240px, 320px) 1fr; gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .split { grid-template-columns: 1fr; } }

  button.btn, .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--row-hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--danger); }
  .btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.small { padding: 3px 8px; font-size: 12.5px; }
  .btn:disabled { opacity: .55; cursor: default; }

  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; font-weight: 500; margin-bottom: 4px; }
  .field small { display: block; color: var(--muted); margin-top: 3px; }
  input, select, textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type=checkbox] { width: auto; }
  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 12px; }
  .filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0 12px; align-items: end; }
  @media (max-width: 520px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
  .effect-row { border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px 0; margin-bottom: 8px; }
  .lines > div { white-space: nowrap; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-weight: 500; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  tbody tr:hover { background: var(--row-hover); }
  tr.clickable { cursor: pointer; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pos { color: var(--ok); } .neg { color: var(--danger); }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
  .actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }

  .tier-list { list-style: none; margin: 0; padding: 6px; }
  .tier-list li { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 6px; cursor: pointer; }
  .tier-list li:hover { background: var(--row-hover); }
  .tier-list li.selected { background: var(--row-hover); box-shadow: inset 3px 0 0 var(--accent); }
  .tier-list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .switch { position: relative; width: 34px; height: 20px; flex: none; border-radius: 999px; border: 0; background: var(--border); cursor: pointer; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch.on { background: var(--ok); }
  .switch.on::after { transform: translateX(14px); }

  pre.json { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow: auto; max-height: 360px; margin: 0; }
  .secret { display: flex; gap: 8px; align-items: center; background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; word-break: break-all; }
  .callout { border: 1px solid var(--border); border-left: 3px solid var(--warn); border-radius: 6px; padding: 10px 12px; background: var(--code-bg); }

  .login { max-width: 440px; margin: 8vh auto; padding: 0 16px; }
  .login .panel + .panel { margin-top: 16px; }
  details > summary { cursor: pointer; font-weight: 500; }

  dialog { border: 1px solid var(--border); border-radius: 10px; padding: 0; background: var(--panel); color: var(--text); width: min(520px, calc(100vw - 32px)); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog .panel-body { max-height: 70vh; overflow: auto; }
  dialog footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .form-error { color: var(--danger); margin: 0 0 12px; }

  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: calc(100vw - 32px); }
  .toast { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--ok); border-radius: 6px; padding: 10px 14px; box-shadow: var(--shadow); max-width: 380px; }
  .toast.error { border-left-color: var(--danger); }
</style>
</head>
<body>

<div id="login-view" class="login hidden">
  <div class="panel">
    <div class="panel-head"><h2>Points Engine Admin</h2></div>
    <form class="panel-body" id="login-form">
      <label class="field"><span>Tenant API key</span>
        <input name="key" type="password" autocomplete="off" placeholder="pce_…" required>
        <small>Stored only in this browser tab's session storage.</small>
      </label>
      <p class="form-error hidden" id="login-error"></p>
      <button class="btn primary" type="submit">Connect</button>
    </form>
  </div>
  <div class="panel">
    <details class="panel-body">
      <summary>Onboard a new tenant (platform operator)</summary>
      <form id="tenant-form" style="margin-top:14px">
        <label class="field"><span>Platform admin token</span><input name="token" type="password" autocomplete="off" required></label>
        <label class="field"><span>Tenant name</span><input name="name" required></label>
        <label class="field"><span>Architecture key</span><input name="architecture_key" placeholder="user_id"><small>Optional; can be set later.</small></label>
        <p class="form-error hidden" id="tenant-error"></p>
        <button class="btn" type="submit">Create tenant</button>
      </form>
    </details>
  </div>
</div>

<div id="app-view" class="hidden">
  <header>
    <h1>Points Engine Admin</h1>
    <span class="badge" id="arch-badge"></span>
    <span class="spacer"></span>
    <button class="btn small" id="logout">Disconnect</button>
  </header>
  <div class="layout">
    <nav id="nav">
      <button data-view="tiers">Tiers &amp; rules</button>
      <button data-view="point-types">Point types</button>
      <button data-view="levels">Levels</button>
      <button data-view="profiles">Profiles</button>
      <button data-view="logs">Ledger</button>
      <button data-view="playground">Test &amp; adjust</button>
      <button data-view="settings">Settings</button>
    </nav>
    <main id="main"></main>
  </div>
</div>

<dialog id="dialog"></dialog>
<div id="toasts"></div>

<script>
"use strict";

// ---------- tiny DOM helper (all data goes through textContent, never innerHTML) ----------
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const $ = (sel) => document.querySelector(sel);

// ---------- API client ----------
class ApiError extends Error {
  constructor(status, code, message) { super(message); this.status = status; this.code = code; }
}
const store = {
  get key() { try { return sessionStorage.getItem("pc_key") || ""; } catch { return mem.key; } },
  set key(v) { try { v ? sessionStorage.setItem("pc_key", v) : sessionStorage.removeItem("pc_key"); } catch { mem.key = v; } },
};
const mem = { key: "" };

async function api(method, path, body, token) {
  const headers = { "Authorization": "Bearer " + (token || store.key) };
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const res = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) {
    const e = (data && data.error) || {};
    if (res.status === 401 && !token) { logout("Your API key is no longer valid."); }
    throw new ApiError(res.status, e.code || "error", e.message || res.statusText);
  }
  return { status: res.status, data, headers: res.headers };
}

function qs(params) {
  const p = new URLSearchParams();
  for (const [k, v] of Object.entries(params)) if (v !== "" && v != null) p.set(k, v);
  const s = p.toString();
  return s ? "?" + s : "";
}

// ---------- UI feedback ----------
function toast(msg, isError) {
  const t = h("div", { class: "toast" + (isError ? " error" : "") }, msg);
  $("#toasts").append(t);
  setTimeout(() => t.remove(), isError ? 6000 : 3000);
}
function errMsg(e) { return e instanceof ApiError ? `${e.message} (${e.code})` : String(e.message || e); }

const fmtTime = (s) => s ? new Date(s).toLocaleString() : "—";
const fmtNum = (n) => Number(n).toLocaleString();
const signed = (n) => h("span", { class: n > 0 ? "pos" : "neg" }, (n > 0 ? "+" : "") + fmtNum(n));
const statusBadge = (on) => h("span", { class: "badge " + (on ? "on" : "off") }, on ? "Active" : "Inactive");
function fmtDuration(sec) {
  if (!sec) return "—";
  const units = [[86400, "d"], [3600, "h"], [60, "m"], [1, "s"]];
  for (const [n, u] of units) if (sec % n === 0) return (sec / n) + u;
  return sec + "s";
}

// ---------- modal form ----------
// fields: [{name, label, type: text|number|textarea|checkbox|select|custom, value, help, required, options, placeholder}]
// A custom field brings its own control element and a read() that returns its value (or throws).
function openForm({ title, fields = [], submitLabel = "Save", danger = false, wide = false, intro, onSubmit }) {
  const dlg = $("#dialog");
  const errorEl = h("p", { class: "form-error hidden" });
  const inputs = {};
  const body = h("div", { class: "panel-body" }, intro ? h("p", { style: "margin-top:0" }, intro) : null, errorEl);
  let row = null;
  for (const f of fields) {
    let control;
    if (f.type === "checkbox") {
      control = h("input", { type: "checkbox", name: f.name, checked: f.value });
      inputs[f.name] = control;
      body.append(h("label", { class: "check" }, control, f.label));
      continue;
    }
    if (f.type === "custom") {
      // A div, not a label: a label would forward clicks on its blank space to the first button inside.
      body.append(h("div", { class: "field" }, h("span", {}, f.label), f.control, f.help ? h("small", {}, f.help) : null));
      row = null;
      continue;
    }
    if (f.type === "textarea") control = h("textarea", { name: f.name, rows: 3 }, f.value || "");
    else if (f.type === "select") control = h("select", { name: f.name }, f.options.map((o) => h("option", { value: o.value, selected: o.value === f.value }, o.label)));
    else control = h("input", { name: f.name, type: f.type || "text", value: f.value ?? "", required: f.required, placeholder: f.placeholder, step: f.type === "number" ? "1" : null, min: f.min });
    inputs[f.name] = control;
    const field = h("label", { class: "field" }, h("span", {}, f.label), control, f.help ? h("small", {}, f.help) : null);
    if (f.half) {
      if (!row) { row = h("div", { class: "grid2" }); body.append(row); }
      row.append(field);
      if (row.children.length === 2) row = null;
    } else { row = null; body.append(field); }
  }
  const submit = h("button", { class: "btn " + (danger ? "danger solid" : "primary"), type: "submit" }, submitLabel);
  const form = h("form", { method: "dialog" },
    h("div", { class: "panel-head" }, h("h3", {}, title)),
    body,
    h("footer", {}, h("button", { class: "btn", type: "button", onclick: () => dlg.close() }, "Cancel"), submit));
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    submit.disabled = true;
    errorEl.classList.add("hidden");
    try {
      const values = {};
      for (const f of fields) {
        const el = inputs[f.name];
        if (f.type === "custom") values[f.name] = f.read();
        else if (f.type === "checkbox") values[f.name] = el.checked;
        else if (f.type === "number") values[f.name] = el.value === "" ? 0 : parseInt(el.value, 10);
        else values[f.name] = el.value.trim();
      }
      await onSubmit(values);
      dlg.close();
    } catch (e) {
      errorEl.textContent = errMsg(e);
      errorEl.classList.remove("hidden");
    } finally { submit.disabled = false; }
  });
  dlg.style.width = wide ? "min(720px, calc(100vw - 32px))" : "";
  dlg.replaceChildren(form);
  dlg.showModal();
  const first = form.querySelector("input:not([type=checkbox]),textarea,select");
  if (first) first.focus();
}

function confirmDanger(title, message, label, action) {
  openForm({ title, intro: message, submitLabel: label, danger: true, onSubmit: action });
}

// ---------- point types & effects ----------
const primarySlug = () => state.pointTypes.find((t) => t.is_primary)?.slug || "points";
function ordinal(n) {
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function expirySummary(mode, value) {
  if (mode === "days") return `${fmtNum(value)} day${value === 1 ? "" : "s"}`;
  if (mode === "end_of_month") return value === 1 ? "end of month" : `end of ${ordinal(value)} month`;
  return "never";
}
const expiryNote = (mode, value) => mode === "never" ? "never expires" : `expires ${mode === "days" ? "after" : "at"} ${expirySummary(mode, value)}`;
const limitsSummary = (limits) => (limits || []).map((l) => `${l.direction === "credit" ? "earn" : "spend"} ≤ ${fmtNum(l.max)}/${l.period}`).join(" · ");
// orderedBalances lists a {slug: value} map in point type order (primary first).
const orderedBalances = (m) => {
  const rank = (slug) => { const i = state.pointTypes.findIndex((t) => t.slug === slug); return i < 0 ? 1e9 : i; };
  return Object.entries(m || {}).sort(([a], [b]) => rank(a) - rank(b) || a.localeCompare(b));
};
// lineList renders ledger lines as "coins +10 (100 → 110)", one point type per line.
const lineList = (lines) => (lines || []).length ? h("div", { class: "lines" }, lines.map((l) => h("div", {},
  h("span", { class: "muted mono" }, l.point_type + " "), signed(l.delta),
  h("span", { class: "muted" }, ` (${fmtNum(l.balance_before)} → `), h("strong", {}, fmtNum(l.balance_after)), h("span", { class: "muted" }, ")")))) : h("span", { class: "muted" }, "—");
// balancesText renders {slug: {balance}} or {slug: number} compactly, e.g. "coins 1,250 · xp 30".
const balancesText = (m) => orderedBalances(m).map(([slug, b]) => `${slug} ${fmtNum(b.balance ?? b)}`).join(" · ");

function effectSummary(e) {
  const pt = e.point_type || primarySlug();
  const sign = e.direction === "debit" ? "-" : "+";
  const notes = [];
  let text;
  if (e.kind === "per_spend") text = `${sign}${fmtNum(e.rate_points)} ${pt} per ${fmtNum(e.rate_per)} spend`;
  else if (e.kind === "input") { text = `${sign}amount ${pt}`; if (e.min) notes.push(`min ${fmtNum(e.min)}`); }
  else if (e.kind === "streak") { const st = e.steps || []; text = `${sign}${st.slice(0, 7).join("/")}${st.length > 7 ? "/…" : ""} ${pt} streak`; }
  else text = `${sign}${fmtNum(e.amount)} ${pt}`;
  if (e.max) notes.push(`max ${fmtNum(e.max)}`);
  if (e.expiry_mode) notes.push(expiryNote(e.expiry_mode, e.expiry_value));
  return notes.length ? `${text} (${notes.join(", ")})` : text;
}
const effectsSummary = (r) => (r.effects || []).map(effectSummary).join(" · ") || "no points";
const hasKind = (r, kind) => (r.effects || []).some((e) => e.kind === kind);

// expiryControl edits an expiry mode/value pair. With inherit, "" keeps the point type's default.
function expiryControl(mode, value, inherit) {
  const sel = h("select", {}, [...(inherit ? [["", "Point type default"]] : []), ["never", "Never"], ["days", "Days after earning"], ["end_of_month", "End of month"]]
    .map(([v, l]) => h("option", { value: v, selected: (mode || "") === v }, l)));
  const val = h("input", { type: "number", step: "1", min: 1, value: value ?? "", placeholder: "90" });
  const hint = h("small", {});
  const sync = () => {
    val.classList.toggle("hidden", sel.value === "" || sel.value === "never");
    hint.textContent = sel.value === "days" ? "Number of days, 1-3,650." :
      sel.value === "end_of_month" ? "Months counting the month earned as 1 (1-120): 3 = end of the 3rd month." : "";
  };
  sel.addEventListener("change", sync);
  sync();
  return {
    el: h("div", {}, h("div", { class: "grid2" }, sel, val), hint),
    read: () => sel.value === "" ? {} : { expiry_mode: sel.value, expiry_value: sel.value === "never" ? null : parseInt(val.value || "0", 10) },
  };
}

const effectKinds = [["fixed", "Fixed amount"], ["per_spend", "Per spend"], ["input", "Amount from request"], ["streak", "Daily streak"]];

// effectsEditor edits a rule's effects as repeatable rows; read() returns the effects array.
function effectsEditor(effects) {
  const list = h("div");
  const empty = h("p", { class: "muted", style: "margin:0 0 8px" }, "No effects: the rule only records spend and orders.");
  const rows = [];
  const num = (v) => v === "" ? undefined : parseInt(v, 10);
  const field = (label, el, help) => h("label", { class: "field" }, h("span", {}, label), el, help ? h("small", {}, help) : null);
  const sync = () => empty.classList.toggle("hidden", rows.length > 0);

  function addRow(e = {}) {
    const input = (value, placeholder) => h("input", { type: "number", step: "1", min: 0, value: value || "", placeholder });
    const pt = h("select", {}, state.pointTypes.map((t) => h("option", { value: t.slug, selected: (e.point_type || primarySlug()) === t.slug }, t.name + (t.is_primary ? " (primary)" : ""))));
    const kind = h("select", {}, effectKinds.map(([v, l]) => h("option", { value: v, selected: (e.kind || "fixed") === v }, l)));
    const dir = h("select", {}, [["credit", "Credit (award)"], ["debit", "Debit (deduct)"]].map(([v, l]) => h("option", { value: v, selected: (e.direction || "credit") === v }, l)));
    const amount = input(e.amount, "10"), ratePoints = input(e.rate_points, "1"), ratePer = input(e.rate_per, "100");
    const min = input(e.min, "none"), max = input(e.max, "none");
    const steps = h("input", { value: (e.steps || []).join(", "), placeholder: "5, 5, 10, 10, 15, 15, 30" });
    const expiry = expiryControl(e.expiry_mode, e.expiry_value, true);
    const maxHelp = h("small", {});
    const f = {
      amount: field("Amount", amount), ratePoints: field("Points", ratePoints), ratePer: field("Per spend of", ratePer, "Smallest currency unit."),
      min: field("Min amount", min), max: h("label", { class: "field" }, h("span", {}, "Max per transaction"), max, maxHelp),
      steps: field("Steps", steps, "Points for day 1, 2, 3… of a daily streak; repeats after the last step. A missed day restarts it."),
      expiry: h("div", { class: "field" }, h("span", {}, "Expiry"), expiry.el),
    };
    const update = () => {
      const k = kind.value;
      // per_spend and streak only credit, and nothing may debit a non-spendable type.
      const creditOnly = k === "per_spend" || k === "streak" || state.pointTypes.find((t) => t.slug === pt.value)?.spendable === false;
      if (creditOnly) dir.value = "credit";
      dir.disabled = creditOnly;
      f.amount.classList.toggle("hidden", k !== "fixed");
      f.ratePoints.classList.toggle("hidden", k !== "per_spend");
      f.ratePer.classList.toggle("hidden", k !== "per_spend");
      f.min.classList.toggle("hidden", k !== "input");
      f.max.classList.toggle("hidden", k !== "per_spend" && k !== "input");
      maxHelp.textContent = k === "input" ? "Larger amounts are rejected." : "Larger awards are capped.";
      f.steps.classList.toggle("hidden", k !== "streak");
      f.expiry.classList.toggle("hidden", dir.value !== "credit");
    };
    for (const el of [pt, kind, dir]) el.addEventListener("change", update);
    update();

    const row = {
      pt,
      el: h("div", { class: "effect-row" },
        h("div", { class: "grid3" }, field("Point type", pt), field("Kind", kind), field("Direction", dir)),
        h("div", { class: "grid3" }, f.amount, f.ratePoints, f.ratePer, f.min, f.max),
        f.steps, f.expiry,
        h("div", { class: "actions", style: "margin-bottom:10px" }, h("button", { class: "btn small danger", type: "button", onclick: () => {
          rows.splice(rows.indexOf(row), 1); row.el.remove(); sync();
        } }, "Remove"))),
      read: () => {
        const k = kind.value, out = { point_type: pt.value, kind: k, direction: dir.value };
        if (k === "fixed") out.amount = num(amount.value);
        if (k === "per_spend") { out.rate_points = num(ratePoints.value); out.rate_per = num(ratePer.value); }
        if (k === "input") out.min = num(min.value);
        if (k === "per_spend" || k === "input") out.max = num(max.value);
        if (k === "streak") {
          out.steps = steps.value.split(/[\s,]+/).filter(Boolean).map(Number);
          if (!out.steps.length || out.steps.some((n) => !Number.isInteger(n) || n < 1)) throw new Error("Streak steps must be positive whole numbers separated by commas.");
        }
        if (dir.value === "credit") Object.assign(out, expiry.read());
        return out;
      },
    };
    rows.push(row);
    list.append(row.el);
    sync();
  }

  for (const e of effects) addRow(e);
  sync();
  // New rows default to the first point type no other row uses yet.
  const addBtn = h("button", { class: "btn small", type: "button", onclick: () => {
    const taken = new Set(rows.map((r) => r.pt.value));
    addRow({ point_type: state.pointTypes.find((t) => !taken.has(t.slug))?.slug });
  } }, "+ Add effect");
  return { el: h("div", {}, list, empty, addBtn), read: () => rows.map((r) => r.read()) };
}

const apiBase = () => location.origin;

function codeBlock(label, code) {
  const copy = h("button", { class: "btn small", type: "button", onclick: async () => {
    try { await navigator.clipboard.writeText(code); copy.textContent = "Copied"; setTimeout(() => { copy.textContent = "Copy"; }, 1500); }
    catch { copy.textContent = "Select & copy manually"; }
  } }, "Copy");
  return h("div", {},
    h("div", { style: "display:flex;align-items:center;justify-content:space-between;margin-bottom:6px" }, h("strong", {}, label), copy),
    h("pre", { class: "json" }, code));
}

function executeSnippets(tierSlug, r) {
  const entityField = state.arch || "entity_id";
  const payload = { [entityField]: "USER_ID_HERE", tier: tierSlug, rule: r.slug };
  // per_spend effects need the order value; input effects need the amount to apply.
  if (hasKind(r, "per_spend")) payload.spend = 125000;
  if (hasKind(r, "input")) payload.amount = 500;
  payload.idempotency_key = "UNIQUE_EVENT_ID";
  const body = JSON.stringify(payload, null, 2);
  const curl = `curl -X POST ${apiBase()}/engine/execute \\
  -H "Authorization: Bearer $POINTS_API_KEY" \\
  -H "Content-Type: application/json" \\
  -d '${JSON.stringify(payload)}'`;
  const js = `const res = await fetch("${apiBase()}/engine/execute", {
  method: "POST",
  headers: {
    "Authorization": \`Bearer \${process.env.POINTS_API_KEY}\`,
    "Content-Type": "application/json",
  },
  body: JSON.stringify(${body.replace(/\n/g, "\n  ")}),
});
// 201 = applied, 200 = idempotent replay, 429 = cooldown / rate limit / streak already claimed (see Retry-After)
const result = await res.json();`;
  return [codeBlock("Endpoint", `POST ${apiBase()}/engine/execute`), codeBlock("cURL", curl), codeBlock("JavaScript (fetch)", js)];
}

    p.basis === "calendar" ? `${what} in each ${periodLabel(p.period_months)} period counted from 1 January. A level reached in one period is kept through the next` :
    `lifetime ${what}`;
  const tenure = p.min_tenure_days ? `, but never within ${p.min_tenure_days} days of reaching it` : "";

    !state.arch ? h("div", { class: "callout", style: "margin-bottom:12px" }, "Set the entity key in Settings before executing rules.") : null,
    h("label", { class: "field" }, h("span", {}, state.arch || "Entity ID"), entity),
    h("div", { class: "grid2" }, h("label", { class: "field" }, h("span", {}, "Tier"), tierSel), h("label", { class: "field" }, h("span", {}, "Rule"), ruleSel, ruleSlugInput)),
    h("label", { class: "field" }, h("span", {}, "Spend"), spend,
      h("small", {}, "Order value in your smallest currency unit; counts toward levels and per-spend effects. Negative for a refund.")),
    h("label", { class: "field" }, h("span", {}, "Amount"), amount,
      h("small", {}, "For rules with an amount-from-request effect, e.g. coins to redeem at checkout.")),
    h("label", { class: "field" }, h("span", {}, "Idempotency key"),
      h("div", { style: "display:flex;gap:8px" }, idem, h("button", { class: "btn", type: "button", onclick: () => { idem.value = newKey(); } }, "Generate")),
      h("small", {}, "Resubmitting with the same key replays the original result instead of crediting twice.")),
    h("button", { class: "btn primary", type: "submit", disabled: !state.tiers.length }, "Execute"));

  // Adjustment form
  const adjEntity = h("input", { required: true, placeholder: "user123" });
  const adjPoints = h("input", { type: "number", step: "1", placeholder: "-50" });
  const adjType = h("select", {}, state.pointTypes.map((t) => h("option", { value: t.slug, selected: t.is_primary }, t.name)));
  const adjSpend = h("input", { type: "number", step: "1", placeholder: "0" });
  const adjOrders = h("input", { type: "number", step: "1", placeholder: "0" });
  const adjReason = h("input", { required: true, placeholder: "Refund for order #1234" });
  const adjForm = h("form", { class: "panel-body", onsubmit: (e) => {
    e.preventDefault();
    run(() => api("POST", "/admin/adjustments", {
      entity_id: adjEntity.value.trim(), point_type: adjType.value, points: parseInt(adjPoints.value || "0", 10),
      spend: parseInt(adjSpend.value || "0", 10), orders: parseInt(adjOrders.value || "0", 10), reason: adjReason.value.trim(), idempotency_key: newKey(),
    }));
  } },
    h("p", { class: "muted", style: "margin-top:0" }, "The ledger is append-only. Correct a balance, spend or order count by recording a compensating entry."),
    h("label", { class: "field" }, h("span", {}, state.arch || "Entity ID"), adjEntity),
    h("div", { class: "grid2" }, h("label", { class: "field" }, h("span", {}, "Points (±)"), adjPoints), h("label", { class: "field" }, h("span", {}, "Point type"), adjType)),
    h("div", { class: "grid2" }, h("label", { class: "field" }, h("span", {}, "Spend (±)"), adjSpend), h("label", { class: "field" }, h("span", {}, "Orders (±)"), adjOrders)),
    h("label", { class: "field" }, h("span", {}, "Reason"), adjReason),
    h("button", { class: "btn primary", type: "submit" }, "Record adjustment"));

  main.replaceChildren(h("div", { class: "split", style: "grid-template-columns:minmax(300px,440px) 1fr" },
    h("div", { class: "stack" },
      h("div", { class: "panel" }, h("div", { class: "panel-head" }, h("h3", {}, "Execute a rule")), state.tiers.length ? execForm : h("div", { class: "empty" }, "Create a tier and rule first.")),
      h("div", { class: "panel" }, h("div", { class: "panel-head" }, h("h3", {}, "Manual adjustment")), adjForm)),
    h("div", { class: "panel" }, h("div", { class: "panel-head" }, h("h3", {}, "Response")), h("div", { class: "panel-body" }, summary, output))));
  await loadRules();
}

// ---------- Settings ----------
function integrationPanel() {
  const ep = (method, path, desc) => h("tr", {}, h("td", { class: "mono", style: "white-space:nowrap" }, method), h("td", { class: "mono" }, path), h("td", { class: "muted" }, desc));
  return h("div", { class: "panel" },
    h("div", { class: "panel-head" }, h("h3", {}, "API endpoints for your app")),
    h("div", { class: "panel-body", style: "padding-bottom:0" },
      h("p", { class: "muted", style: "margin-top:0" },
        `Base URL ${apiBase()}. Authenticate every request with "Authorization: Bearer <API key>". `,
        "There's one execute endpoint for all rules: pick the rule with the tier and rule slugs in the body. Each rule's API button shows a ready-made request.")),
    h("div", { class: "table-wrap" }, h("table", {},
      h("thead", {}, h("tr", {}, h("th", {}, "Method"), h("th", {}, "Path"), h("th", {}, "Use"))),
      h("tbody", {},
        ep("POST", "/engine/execute", `Trigger a rule: { "${state.arch || "entity_id"}", "tier", "rule", "spend", "amount", "idempotency_key" }. tier is optional when the user's level links one; amount is for rules that take one`),
        ep("GET", "/data/profiles/{id}", "A user's balances per point type, level, spend and orders"),
        ep("GET", "/data/profiles/{id}/expirations", "A user's points that are due to expire, soonest first"),
        ep("GET", "/data/profiles/{id}/level-history", "A user's level changes"),
        ep("GET", "/data/profiles/{id}/logs", "A user's point history (paginated, ?point_type=)"),
        ep("GET", "/data/profiles", "All profiles (paginated, ?tier=&level=)"),
        ep("GET", "/data/logs", "Ledger, filterable by ?from=&to=&tier=&rule=&entity_id=&entry_type=&point_type="),
        ep("POST", "/admin/adjustments", "Manual correction: { entity_id, point_type, points, spend, orders, reason }")))));
}

async function renderSettings(main) {
  const [{ data: keysData }, { data: settings }] = await Promise.all([api("GET", "/admin/api-keys"), api("GET", "/admin/settings")]);
  const refresh = () => renderSettings(main).catch((e) => toast(errMsg(e), true));

  const archInput = h("input", { value: state.arch || "", placeholder: "user_id", required: true });
  const archForm = h("form", { class: "panel-body", onsubmit: async (e) => {
    e.preventDefault();
    try {
      const { data } = await api("POST", "/admin/architecture", { key: archInput.value.trim() });
      state.arch = data.architecture_key; renderArch(); toast("Entity key saved");
    } catch (err) { toast(errMsg(err), true); }
  } },
    h("p", { class: "muted", style: "margin-top:0" }, "The identifier your platform attaches points to, e.g. user_id, wallet_address or device_id. It can't be changed once profiles exist."),
    h("label", { class: "field" }, h("span", {}, "Architecture key"), archInput),
    h("button", { class: "btn primary", type: "submit" }, "Save"));

  // Suggest IANA zone names where the browser can list them; any valid name is accepted.
  const zones = Intl.supportedValuesOf ? Intl.supportedValuesOf("timeZone") : [];
  const tzInput = h("input", { value: settings.timezone, placeholder: "Asia/Dhaka", required: true, list: "tz-list", autocomplete: "off" });
  const tzForm = h("form", { class: "panel-body", onsubmit: async (e) => {
    e.preventDefault();
    try { const { data } = await api("PATCH", "/admin/settings", { timezone: tzInput.value.trim() }); tzInput.value = data.timezone; toast("Time zone saved"); }
    catch (err) { toast(errMsg(err), true); }
  } },
    h("p", { class: "muted", style: "margin-top:0" }, `Workspace "${settings.name}". Day, week and month limits, month-end expiry, check-in streak days and calendar level periods follow this time zone.`),
    h("label", { class: "field" }, h("span", {}, "Time zone"), tzInput, h("datalist", { id: "tz-list" }, zones.map((z) => h("option", { value: z })))),
    h("button", { class: "btn primary", type: "submit" }, "Save"));

  const active = keysData.data.filter((k) => !k.revoked_at).length;
  const keysTable = h("div", { class: "table-wrap" }, h("table", {},
    h("thead", {}, h("tr", {}, h("th", {}, "Name"), h("th", {}, "Key"), h("th", {}, "Created"), h("th", {}, "Status"), h("th", {}))),
    h("tbody", {}, keysData.data.map((k) => h("tr", {},
      h("td", {}, k.name || h("span", { class: "muted" }, "—")),
      h("td", { class: "mono" }, k.prefix + "…"),
      h("td", { class: "muted" }, fmtTime(k.created_at)),
      h("td", {}, k.revoked_at ? h("span", { class: "badge off" }, "Revoked") : h("span", { class: "badge on" }, "Active")),
      h("td", {}, k.revoked_at ? null : h("div", { class: "actions" }, h("button", { class: "btn small danger", disabled: active <= 1, title: active <= 1 ? "Create another key first" : null,
        onclick: () => confirmDanger("Revoke API key", `Revoke ${k.prefix}…? Requests using it will be rejected immediately.`, "Revoke",
          async () => { await api("DELETE", `/admin/api-keys/${k.id}`); toast("Key revoked"); refresh(); }) }, "Revoke"))))))));

  main.replaceChildren(h("div", { class: "stack", style: "max-width:860px" },
    h("div", { class: "panel" }, h("div", { class: "panel-head" }, h("h3", {}, "Entity key")), archForm),
    h("div", { class: "panel" }, h("div", { class: "panel-head" }, h("h3", {}, "Time zone")), tzForm),
    integrationPanel(),
    h("div", { class: "panel" },
      h("div", { class: "panel-head" }, h("h3", {}, "API keys"), h("span", { class: "spacer" }),
        h("button", { class: "btn small primary", onclick: () => openForm({ title: "New API key", fields: [{ name: "name", label: "Name", placeholder: "production-backend" }], submitLabel: "Create",
          onSubmit: async (v) => { const { data } = await api("POST", "/admin/api-keys", v); refresh(); setTimeout(() => showSecret("New API key", data.secret), 0); } }) }, "+ New key")),
      keysTable)));
}

// ---------- boot ----------
$("#nav").addEventListener("click", (e) => { const v = e.target.closest("button")?.dataset.view; if (v) go(v); });
$("#logout").addEventListener("click", () => logout());
// Wide dialogs (rule editor, profile details) go back to the default width when closed.
$("#dialog").addEventListener("close", () => { $("#dialog").style.width = ""; });
window.addEventListener("hashchange", () => { if (store.key && state.view !== location.hash.slice(1)) go(location.hash.slice(1)); });

$("#login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = $("#login-error");
  err.classList.add("hidden");
  try { await connect(e.target.elements.namedItem("key").value.trim()); e.target.reset(); }
  catch (ex) { err.textContent = ex.status === 401 ? "That API key isn't valid." : errMsg(ex); err.classList.remove("hidden"); }
});

$("#tenant-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target, el = f.elements, err = $("#tenant-error");
  err.classList.add("hidden");
  const body = { name: el.namedItem("name").value.trim() };
  const arch = el.namedItem("architecture_key").value.trim();
  if (arch) body.architecture_key = arch;
  try {
    const { data } = await api("POST", "/platform/tenants", body, el.namedItem("token").value);
    const secret = data.api_key.secret;
    f.reset();
    await connect(secret);
    showSecret(`Tenant "${data.tenant.name}" created`, secret, "This is the tenant's API key. It's shown only once. You're now signed in with it.");
  } catch (ex) { err.textContent = ex.status === 401 ? "Invalid platform admin token." : errMsg(ex); err.classList.remove("hidden"); }
});

if (store.key) connect(store.key).catch(() => logout());
else logout();
</script>
</body>
</html>
