services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: points
      POSTGRES_PASSWORD: points
      POSTGRES_DB: points
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U points"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgres://points:points@postgres:5432/points?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN:-change-me}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
